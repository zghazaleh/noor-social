name: Daily Instagram Post

# Fail-closed daily verse poster. 05:30 UTC == 09:30 Asia/Dubai.
#
# DO NOT Enable this workflow in the Actions UI until IG_ACCESS_TOKEN and
# IG_USER_ID are minted by CoS and stored as repository secrets. Empty
# secrets fail the job (no post, no invented token). The schedule below is
# ready; Enable is a human step after secrets exist.
#
# Images are fetched from https://nooralhikmah.com/cards/{id}.png (not GitHub raw).
# Captions are queued fields verified against https://nooralhikmah.com/poems/{id}.
on:
  # Publication paused by user approval on 2026-10-03. No cron trigger.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve + log without posting (leave on until secrets are real)"
        type: boolean
        default: true
      post_date:
        description: "Override date (YYYY-MM-DD, optional)"
        type: string
        default: ""

permissions:
  contents: write # to commit the daily post-log (also keeps the scheduled workflow from auto-disabling)

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    # Manual dispatch also remains paused until the verified release is approved.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fail loudly if Meta secrets are empty (real post only)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "${IG_ACCESS_TOKEN}" ] || [ -z "${IG_USER_ID}" ]; then
            echo "::error::IG_ACCESS_TOKEN / IG_USER_ID are empty. Fail closed — no post, no invented token."
            echo "Do not Enable the Daily Instagram Post schedule until CoS mints both secrets."
            exit 1
          fi
      - name: Post today's verse
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CARD_BASE_URL: https://nooralhikmah.com/
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          POST_DATE: ${{ github.event.inputs.post_date }}
        run: python post_today.py
      - name: Commit post log
        run: |
          git config user.name "noor-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add post-log.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "log: daily post run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true

