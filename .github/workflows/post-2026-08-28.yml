name: Daily Instagram Post

# One-shot for 2026-08-28 (queue ID 1503). The repo's daily-post.yml is
# disabled_manually, and the agent GitHub App cannot enable it or create a
# workflow_dispatch (403). A new workflow path is enabled by default; this
# run is triggered by adding .github/triggers/post-2026-08-28 on main.
# Same post_today.py gates: allowlist, live-site PNG HEAD, no substitute IDs.
on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/post-2026-08-28"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve + log without posting"
        type: boolean
        default: false
      post_date:
        description: "Override date (YYYY-MM-DD, optional)"
        type: string
        default: "2026-08-28"

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post today's verse
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CARD_BASE_URL: https://nooralhikmah.com/
          DRY_RUN: "false"
          POST_DATE: "2026-08-28"
        run: python post_today.py
      - name: Commit post log
        run: |
          git config user.name "noor-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add post-log.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "log: daily post run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
